name: Refresh profile cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build.py]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PROFILE_TOKEN is a read-only PAT: build.py clones every repository with my commits (private,
      # org and upstream) to count the lines I wrote. Only aggregate numbers are logged or committed.
      # Without it the build keeps the cached data instead of shrinking the numbers.
      - run: python build.py
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets data.json
          git diff --cached --quiet || (git commit -m "Refresh profile cards" && git push)
